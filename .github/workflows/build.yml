name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # чтобы выкладывать APK в Releases для обновлений внутри приложения
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fonts
        run: |
          mkdir -p app/src/main/res/font
          for w in Medium SemiBold Bold; do
            lw=$(echo $w | tr 'A-Z' 'a-z')
            curl -fsSL -o app/src/main/res/font/chakra_$lw.ttf \
              https://raw.githubusercontent.com/google/fonts/main/ofl/chakrapetch/ChakraPetch-$w.ttf
          done
          curl -fsSL -o app/src/main/res/font/manrope.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf"
          ls -la app/src/main/res/font

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Ошибки компиляции — в аннотации, чтобы их было видно без скачивания логов.
          ERR=$(grep -E "^e: |error:|What went wrong|Could not|FAILED" build.log | head -60)
          enc() { python3 -c 'import sys; s=sys.stdin.read()[-15000:]; print(s.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          echo "::error title=errors::$(printf '%s' "$ERR" | enc)"

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk car-radio-v$VER.apk

      - uses: actions/upload-artifact@v4
        with:
          name: car-radio-apk
          path: car-radio-v*.apk
          retention-days: 30
          if-no-files-found: error

      # Новая версия (versionName) — новый релиз. Приложение берёт обновления отсюда.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER already exists"
          else
            git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
            gh release create "v$VER" "car-radio-v$VER.apk" --title "Авторадио $VER" --notes-file notes.txt
          fi
